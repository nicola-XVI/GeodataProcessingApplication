[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodata-processing"
version = "0.1.0"
description = "Standalone geodata processing application for 3D terrain and building mesh generation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh[easy]>=4.0",
    "gmsh>=4.11",
    "meshio>=5.3",
    "triangle>=20230923",
    "shapely>=2.0",
    "rasterio>=1.3",
    "requests>=2.28",
    "pydantic>=2.0",
    "scikit-fmm>=2023.4",
]

[project.optional-dependencies]
cad = ["cadquery>=2.3"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
